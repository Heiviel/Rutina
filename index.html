<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0D0D">
<title>Mis Rutinas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0D0D0D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px 40px}
#landing{max-width:400px;width:100%}
.routine-btn{width:100%;padding:22px 20px;border-radius:22px;border:1px solid;cursor:pointer;text-align:left;margin-bottom:14px;transition:transform .12s;display:block;background:none}
.routine-btn:active{transform:scale(.97)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.diff-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.diff-pill{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.55)}
.vs-divider{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.vs-divider::before,.vs-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
.vs-divider span{font-size:11px;color:rgba(255,255,255,.25);font-weight:700;letter-spacing:2px}
#frame-wrap{display:none;position:fixed;inset:0;z-index:100;background:#0D0D0D;flex-direction:column}
#frame-wrap.on{display:flex}
#back-bar{flex-shrink:0;padding:9px 14px;background:rgba(13,13,13,.97);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
#back-bar button{background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.65);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
#rt-label{font-size:12px;color:rgba(255,255,255,.35);letter-spacing:1px}
#routine-frame{flex:1;width:100%;border:none;background:#0D0D0D}
</style>
</head>
<body>

<div id="landing">
  <div style="text-align:center;margin-bottom:28px;padding-top:12px">
    <div style="font-size:52px;margin-bottom:10px">&#127947;&#65039;</div>
    <h1 style="font-size:26px;font-weight:900;letter-spacing:-.5px">Mis Rutinas</h1>
    <p style="color:rgba(255,255,255,.4);font-size:13px;margin-top:6px">Elige el entrenamiento de hoy</p>
  </div>

  <button class="routine-btn" style="border-color:rgba(255,87,34,.4);background:rgba(255,87,34,.06)" onclick="open_routine(1)">
    <div class="badge" style="background:rgba(255,87,34,.2);color:#FF5722;border:1px solid rgba(255,87,34,.4)">RUTINA 1</div>
    <div style="font-size:18px;font-weight:900;color:#fff;margin-bottom:5px">&#9201;&#65039; Circuito Quemagrasas</div>
    <div style="font-size:12px;color:rgba(255,255,255,.55);line-height:1.55;margin-bottom:10px">8 ejercicios en circuito &middot; 40s trabajo / 20s descanso &middot; 3 rondas &middot; ~30 min.</div>
    <div class="diff-row"><span class="diff-pill">Alta quema</span><span class="diff-pill">Por tiempo</span><span class="diff-pill">Cuerpo completo</span></div>
  </button>

  <div class="vs-divider"><span>VS</span></div>

  <button class="routine-btn" style="border-color:rgba(33,150,243,.4);background:rgba(33,150,243,.06)" onclick="open_routine(2)">
    <div class="badge" style="background:rgba(33,150,243,.2);color:#2196F3;border:1px solid rgba(33,150,243,.4)">RUTINA 2</div>
    <div style="font-size:18px;font-weight:900;color:#fff;margin-bottom:5px">&#128170; Fuerza PPL + HIIT</div>
    <div style="font-size:12px;color:rgba(255,255,255,.55);line-height:1.55;margin-bottom:10px">Push/Pull/Legs &middot; Series &times; reps con progresi&oacute;n de carga &middot; Registro de pesos.</div>
    <div class="diff-row"><span class="diff-pill">Progresi&oacute;n</span><span class="diff-pill">Series &times; Reps</span><span class="diff-pill">HIIT</span><span class="diff-pill">Registro</span></div>
  </button>

  <div class="vs-divider"><span>+</span></div>

  <button class="routine-btn" style="border-color:rgba(76,175,80,.4);background:rgba(76,175,80,.06)" onclick="open_routine(3)">
    <div class="badge" style="background:rgba(76,175,80,.2);color:#4CAF50;border:1px solid rgba(76,175,80,.4)">RUTINA 3</div>
    <div style="font-size:18px;font-weight:900;color:#fff;margin-bottom:5px">&#128994; Circuito de Bandas El&aacute;sticas</div>
    <div style="font-size:12px;color:rgba(255,255,255,.55);line-height:1.55;margin-bottom:10px">8 ejercicios con banda &middot; 40s / 20s &middot; 3 rondas. Solo bandas, sin cardio.</div>
    <div class="diff-row"><span class="diff-pill">Solo banda</span><span class="diff-pill">Por tiempo</span><span class="diff-pill">En cualquier sitio</span></div>
  </button>

  <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;margin-top:4px">
    <div style="font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px">&iquest;Cu&aacute;ndo usar cada una?</div>
    <div style="font-size:12px;color:rgba(255,255,255,.5);line-height:1.5;margin-bottom:9px"><strong style="color:#FF5722">Rutina 1</strong> &mdash; Poco tiempo o variedad sin pensar en pesos.</div>
    <div style="font-size:12px;color:rgba(255,255,255,.5);line-height:1.5;margin-bottom:9px"><strong style="color:#2196F3">Rutina 2</strong> &mdash; Tu plan base. Lun Push, Mi&eacute; HIIT, Vie Pull+Legs.</div>
    <div style="font-size:12px;color:rgba(255,255,255,.5);line-height:1.5"><strong style="color:#4CAF50">Rutina 3</strong> &mdash; Viajes o recuperaci&oacute;n activa. Solo la banda.</div>
  </div>
</div>

<div id="frame-wrap">
  <div id="back-bar">
    <button onclick="close_routine()">&larr; Inicio</button>
    <span id="rt-label"></span>
  </div>
  <iframe id="routine-frame" allow="microphone; fullscreen"></iframe>
</div>

var LABELS={1:"CIRCUITO QUEMAGRASAS",2:"FUERZA PPL + HIIT",3:"BANDAS ELASTICAS"};
function b64decode(s){
  var bytes=Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});
  return new TextDecoder('utf-8').decode(bytes);
}
function open_routine(n){
  var frame=document.getElementById('routine-frame');
  document.getElementById('rt-label').textContent=LABELS[n]||'';
  document.getElementById('frame-wrap').classList.add('on');
  document.getElementById('landing').style.display='none';
  frame.srcdoc=b64decode(ROUTINES[n]);
}
function close_routine(){
  document.getElementById('frame-wrap').classList.remove('on');
  document.getElementById('landing').style.display='block';
  document.getElementById('routine-frame').srcdoc='';
}
